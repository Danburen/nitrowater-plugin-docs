name: docs

on:
  push:
    branches: [main]
    paths-ignore:
      - '.ai/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.ai/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build all plugin sites
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-docs-dist
          path: dist
          retention-days: 14

      - name: Build container image
        run: docker build -t nitrowater-plugin-docs:${{ github.sha }} .

      # 打 tag（v1.2.3）时顺带推送到 GHCR，供 nitrowater 侧 compose 拉取。
      - name: Push image (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nitrowater-plugin-docs
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag nitrowater-plugin-docs:${{ github.sha }} "$IMAGE:${GITHUB_REF_NAME}"
          docker tag nitrowater-plugin-docs:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"
