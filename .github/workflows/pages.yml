name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; queue instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress `lastUpdated` reads git history for every page.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run when it is not enabled yet.
          # Requires the `pages: write` permission declared above.
          # If an organization policy blocks this, enable Pages manually:
          # Settings → Pages → Source = GitHub Actions.
          enablement: true

      - run: npm ci --no-audit --no-fund

      - name: Build docs
        env:
          # Project Pages are served under https://<owner>.github.io/<repo>/,
          # so every plugin site lives at /<repo>/<plugin-id>/.
          # DOCS_OUT_ROOT keeps the artifact root == site root (no duplicated repo segment).
          DOCS_BASE_PREFIX: nitrowater-plugin-docs
          DOCS_OUT_ROOT: dist
        run: npm run build

      - name: Generate landing page
        env:
          DOCS_BASE_PREFIX: nitrowater-plugin-docs
          DOCS_OUT_ROOT: dist
        run: npm run pages:landing

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
