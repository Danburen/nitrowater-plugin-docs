# nitrowater-plugin-docs 容器 nginx 配置
#
# 磁盘布局（= URL 布局，构建产物 dist/ 直接作为 root）：
#   /usr/share/nginx/html/plugin/<id>/...   ->  /plugin/<id>/...
#   /usr/share/nginx/html/plugin/index.html ->  /plugin/
#   /usr/share/nginx/html/plugin/manifest.json -> /plugin/manifest.json
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 上游（BFF）可能以不同 Host 转发，保持相对重定向。
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/manifest+json image/svg+xml;

  # 容器健康检查
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # 聚合仓不提供门户首页：根路径直接 404，入口由 NitroWater 门户负责。
  location = / {
    return 404;
  }

  # 文档：真实文件 -> 目录 index -> 404（不做 SPA fallback，避免吞掉插件站内 404）
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Vite 产出的内容哈希资源：长缓存
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # HTML / JSON：每次回源校验，发布后立即生效
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}
